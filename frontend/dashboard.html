<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Aluno - Sistema APR</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 14px;
        }
        .bloco-item {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 14px;
            background-color: #f9fafb;
        }
        .bloco-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .catalogo-box {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .catalogo-box label {
            color: #1e40af;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border-bottom: 1px solid #e5e7eb;
            padding: 10px 8px;
            text-align: left;
            font-size: 0.92rem;
        }
        th {
            background-color: #f3f4f6;
            font-weight: 600;
        }
        .acoes-tabela {
            display: flex;
            gap: 8px;
        }
        .btn-sm {
            padding: 6px 10px;
            font-size: 0.85rem;
        }
        .sub-card {
            border: 1px dashed #9ca3af;
            padding: 16px;
            border-radius: 6px;
            margin-top: 10px;
            margin-bottom: 16px;
            background-color: #f9fafb;
        }
        @media (max-width: 768px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <h1>Sistema APR — Painel do Aluno</h1>
        <div class="header-actions">
            <span id="nome-aluno"></span>
            <button type="button" class="btn btn-secondary btn-sm" onclick="sair()">Sair</button>
        </div>
    </header>

    <main class="container">
        <div id="alerta-geral" class="alerta"></div>

        <!-- Lista de APRs do Aluno -->
        <section class="card">
            <div class="bloco-topo">
                <h2>Minhas APRs Registradas</h2>
                <button type="button" class="btn btn-primary" onclick="alternarFormularioApr()">+ Nova APR</button>
            </div>
            <div id="lista-aprs">
                <p>Carregando suas APRs...</p>
            </div>
        </section>

        <!-- Formulário de Nova APR -->
        <section id="secao-nova-apr" class="card hidden">
            <div class="bloco-topo">
                <h2>Preencher Nova APR</h2>
                <button type="button" class="btn btn-secondary btn-sm" onclick="alternarFormularioApr()">Fechar</button>
            </div>

            <form id="form-apr" onsubmit="salvarApr(event)">
                <!-- Seleção / Cadastro de Cliente -->
                <div class="form-group">
                    <label for="cliente_id">Cliente / Empresa</label>
                    <div style="display: flex; gap: 10px;">
                        <select id="cliente_id" required>
                            <option value="">Selecione um cliente...</option>
                        </select>
                        <button type="button" class="btn btn-secondary" onclick="toggleNovoCliente()">+ Novo Cliente</button>
                    </div>
                </div>

                <!-- Sub-formulário rápido para cadastrar Cliente -->
                <div id="box-novo-cliente" class="sub-card hidden">
                    <h4 style="margin-bottom: 10px;">Cadastrar Novo Cliente</h4>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Nome / Razão Social *</label>
                            <input type="text" id="cli-nome" placeholder="Ex: Metalúrgica Americana Ltda">
                        </div>
                        <div class="form-group">
                            <label>E-mail *</label>
                            <input type="email" id="cli-email" placeholder="contato@empresa.com.br">
                        </div>
                    </div>
                    <div class="grid-3">
                        <div class="form-group">
                            <label>Endereço *</label>
                            <input type="text" id="cli-endereco" placeholder="Av. Brasil">
                        </div>
                        <div class="form-group">
                            <label>Número *</label>
                            <input type="text" id="cli-numero" placeholder="2801">
                        </div>
                        <div class="form-group">
                            <label>Complemento</label>
                            <input type="text" id="cli-complemento" placeholder="Galpão 2">
                        </div>
                    </div>
                    <div class="grid-3">
                        <div class="form-group">
                            <label>Bairro *</label>
                            <input type="text" id="cli-bairro" placeholder="Jardim Glória">
                        </div>
                        <div class="form-group">
                            <label>Cidade *</label>
                            <input type="text" id="cli-cidade" value="Americana">
                        </div>
                        <div class="form-group">
                            <label>Estado (UF) *</label>
                            <input type="text" id="cli-estado" value="SP" maxlength="2">
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Telefone Fixo</label>
                            <input type="text" id="cli-tel-res" placeholder="(19) 3461-0000">
                        </div>
                        <div class="form-group">
                            <label>Telefone Celular *</label>
                            <input type="text" id="cli-tel-cel" placeholder="(19) 99999-0000">
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary btn-sm" onclick="cadastrarCliente()">Salvar Cliente</button>
                </div>

                <!-- Cabeçalho da Atividade -->
                <div class="grid-2">
                    <div class="form-group">
                        <label for="local">Local do Serviço *</label>
                        <input type="text" id="local" required placeholder="Ex: Oficina de Manutenção Elétrica">
                    </div>
                    <div class="form-group">
                        <label for="data_emissao">Data de Emissão *</label>
                        <input type="date" id="data_emissao" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="atividade">Atividade a ser Executada *</label>
                    <input type="text" id="atividade" required placeholder="Ex: Revisão e troca de disjuntores no painel principal">
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="responsavel_nome">Responsável Técnico (Instrutor / Engenheiro) *</label>
                        <input type="text" id="responsavel_nome" required placeholder="Nome do responsável">
                    </div>
                    <div class="form-group">
                        <label for="responsavel_crea">Registro CREA / CFT *</label>
                        <input type="text" id="responsavel_crea" required placeholder="Ex: SP-506123456/D">
                    </div>
                </div>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e5e7eb;">

                <!-- Etapas com Catálogo Automático de Riscos e EPIs -->
                <div class="bloco-topo">
                    <h3>Etapas da Atividade, Riscos e EPIs</h3>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="adicionarEtapa()">+ Adicionar Etapa</button>
                </div>
                <div id="container-etapas"></div>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e5e7eb;">

                <!-- Executantes -->
                <div class="bloco-topo">
                    <h3>Executantes da Atividade (Equipe)</h3>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="adicionarExecutante()">+ Adicionar Executante</button>
                </div>
                <div id="container-executantes"></div>

                <div style="margin-top: 20px; text-align: right;">
                    <button type="submit" class="btn btn-primary">Salvar APR e Gerar Ficha</button>
                </div>
            </form>
        </section>
    </main>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api';
        const token = localStorage.getItem('apr_token');
        const user = JSON.parse(localStorage.getItem('apr_user') || 'null');

        if (!token || !user) {
            window.location.href = 'index.html';
        }

        document.getElementById('nome-aluno').textContent = `Olá, ${user.name}`;
        document.getElementById('data_emissao').valueAsDate = new Date();

        let catalogoRiscos = [];

        function headersAuth() {
            return {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        function mostrarAlerta(texto, tipo = 'sucesso') {
            const el = document.getElementById('alerta-geral');
            el.textContent = texto;
            el.className = `alerta ${tipo}`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => { el.className = 'alerta'; }, 5000);
        }

        async function sair() {
            try {
                await fetch(`${API_URL}/logout`, { method: 'POST', headers: headersAuth() });
            } catch (e) {}
            localStorage.removeItem('apr_token');
            localStorage.removeItem('apr_user');
            window.location.href = 'index.html';
        }

        function alternarFormularioApr() {
            const sec = document.getElementById('secao-nova-apr');
            sec.classList.toggle('hidden');
        }

        function toggleNovoCliente() {
            document.getElementById('box-novo-cliente').classList.toggle('hidden');
        }

        async function inicializar() {
            await Promise.all([
                carregarCatalogoRiscos(),
                carregarClientes(),
                carregarAprs()
            ]);
            adicionarEtapa();
            adicionarExecutante(user.name);
        }

        async function carregarCatalogoRiscos() {
            try {
                const resp = await fetch(`${API_URL}/catalogo-riscos`, { headers: headersAuth() });
                if (resp.ok) {
                    catalogoRiscos = await resp.json();
                }
            } catch (e) {}
        }

        async function carregarClientes() {
            try {
                const resp = await fetch(`${API_URL}/clientes`, { headers: headersAuth() });
                if (resp.ok) {
                    const clientes = await resp.json();
                    const select = document.getElementById('cliente_id');
                    select.innerHTML = '<option value="">Selecione um cliente...</option>';
                    clientes.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.id;
                        opt.textContent = `${c.nome} (${c.cidade}/${c.estado})`;
                        select.appendChild(opt);
                    });
                }
            } catch (e) {}
        }

        async function cadastrarCliente() {
            const payload = {
                nome: document.getElementById('cli-nome').value,
                email: document.getElementById('cli-email').value,
                endereco: document.getElementById('cli-endereco').value,
                numero: document.getElementById('cli-numero').value,
                complemento: document.getElementById('cli-complemento').value || null,
                bairro: document.getElementById('cli-bairro').value,
                cidade: document.getElementById('cli-cidade').value,
                estado: document.getElementById('cli-estado').value,
                tel_residencial: document.getElementById('cli-tel-res').value || null,
                tel_celular: document.getElementById('cli-tel-cel').value
            };

            try {
                const resp = await fetch(`${API_URL}/clientes`, {
                    method: 'POST',
                    headers: headersAuth(),
                    body: JSON.stringify(payload)
                });

                const texto = await resp.text();
                const dados = texto ? JSON.parse(texto) : {};

                if (!resp.ok) {
                    const erro = dados.errors ? Object.values(dados.errors)[0][0] : dados.message;
                    mostrarAlerta(erro || 'Preencha todos os campos obrigatórios do cliente.', 'erro');
                    return;
                }

                if (!dados.id) {
                    mostrarAlerta('O servidor não retornou o cliente salvo. Verifique o ClienteController.', 'erro');
                    return;
                }

                await carregarClientes();
                document.getElementById('cliente_id').value = dados.id;
                toggleNovoCliente();
                mostrarAlerta('Cliente cadastrado e selecionado!');
            } catch (e) {
                mostrarAlerta('Erro ao comunicar com a API ao salvar o cliente.', 'erro');
            }
        }

        function gerarOpcoesCatalogo() {
            let html = '<option value="">-- Selecione um risco/EPI pronto para preencher automaticamente --</option>';
            catalogoRiscos.forEach(item => {
                html += `<option value="${item.id}">[${item.categoria}] ${item.descricao_etapa}</option>`;
            });
            return html;
        }

        function adicionarEtapa() {
            const container = document.getElementById('container-etapas');
            const num = container.children.length + 1;

            const div = document.createElement('div');
            div.className = 'bloco-item etapa-item';
            div.innerHTML = `
                <div class="bloco-topo">
                    <strong class="titulo-etapa">Etapa ${num}</strong>
                    <button type="button" class="btn btn-danger btn-sm" onclick="removerBloco(this, 'etapa')">Remover</button>
                </div>

                <div class="catalogo-box">
                    <label>Automação: Preencher Riscos e EPIs do Catálogo</label>
                    <select onchange="aplicarModeloRisco(this)">
                        ${gerarOpcoesCatalogo()}
                    </select>
                </div>

                <div class="form-group">
                    <label>Descrição da Etapa *</label>
                    <input type="text" class="etapa-descricao" required placeholder="Descreva o passo da atividade">
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Riscos Envolvidos *</label>
                        <textarea rows="3" class="etapa-riscos" required placeholder="Riscos identificados nesta etapa"></textarea>
                    </div>
                    <div class="form-group">
                        <label>EPIs Obrigatórios e Medidas de Controle *</label>
                        <textarea rows="3" class="etapa-medidas" required placeholder="EPIs e medidas preventivas"></textarea>
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        function aplicarModeloRisco(selectEl) {
            const idSelecionado = Number(selectEl.value);
            if (!idSelecionado) return;

            const modelo = catalogoRiscos.find(r => r.id === idSelecionado);
            if (!modelo) return;

            const bloco = selectEl.closest('.etapa-item');
            bloco.querySelector('.etapa-descricao').value = modelo.descricao_etapa;
            bloco.querySelector('.etapa-riscos').value = modelo.riscos_envolvidos;
            bloco.querySelector('.etapa-medidas').value = modelo.epis_medidas_controle;
        }

        function adicionarExecutante(nomePadrao = '') {
            const container = document.getElementById('container-executantes');
            const div = document.createElement('div');
            div.className = 'bloco-item executante-item';
            div.innerHTML = `
                <div class="bloco-topo">
                    <strong>Executante</strong>
                    <button type="button" class="btn btn-danger btn-sm" onclick="removerBloco(this, 'executante')">Remover</button>
                </div>
                <div class="grid-3">
                    <div class="form-group">
                        <label>Nome Completo *</label>
                        <input type="text" class="exec-nome" required value="${nomePadrao}" placeholder="Nome do aluno/executante">
                    </div>
                    <div class="form-group">
                        <label>Função *</label>
                        <input type="text" class="exec-funcao" required placeholder="Ex: Aluno / Eletricista">
                    </div>
                    <div class="form-group">
                        <label>Matrícula / RA *</label>
                        <input type="text" class="exec-matricula" required placeholder="Ex: 20261045">
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        function removerBloco(btn, tipo) {
            const selector = tipo === 'etapa' ? '.etapa-item' : '.executante-item';
            if (document.querySelectorAll(selector).length <= 1) {
                mostrarAlerta(`A APR precisa ter pelo menos 1 ${tipo}.`, 'erro');
                return;
            }
            btn.closest('.bloco-item').remove();

            if (tipo === 'etapa') {
                document.querySelectorAll('.titulo-etapa').forEach((el, idx) => {
                    el.textContent = `Etapa ${idx + 1}`;
                });
            }
        }

        async function salvarApr(event) {
            event.preventDefault();

            const etapas = Array.from(document.querySelectorAll('.etapa-item')).map((el, idx) => ({
                numero_etapa: idx + 1,
                descricao: el.querySelector('.etapa-descricao').value,
                riscos_envolvidos: el.querySelector('.etapa-riscos').value,
                medidas_controle: el.querySelector('.etapa-medidas').value
            }));

            const executantes = Array.from(document.querySelectorAll('.executante-item')).map(el => ({
                nome: el.querySelector('.exec-nome').value,
                funcao: el.querySelector('.exec-funcao').value,
                matricula: el.querySelector('.exec-matricula').value
            }));

            const payload = {
                cliente_id: document.getElementById('cliente_id').value,
                local: document.getElementById('local').value,
                atividade: document.getElementById('atividade').value,
                responsavel_nome: document.getElementById('responsavel_nome').value,
                responsavel_crea: document.getElementById('responsavel_crea').value,
                data_emissao: document.getElementById('data_emissao').value,
                etapas,
                executantes
            };

            try {
                const resp = await fetch(`${API_URL}/aprs`, {
                    method: 'POST',
                    headers: headersAuth(),
                    body: JSON.stringify(payload)
                });

                const texto = await resp.text();
                const dados = texto ? JSON.parse(texto) : {};

                if (!resp.ok) {
                    const erro = dados.errors ? Object.values(dados.errors)[0][0] : dados.message;
                    mostrarAlerta(erro || 'Erro ao salvar APR.', 'erro');
                    return;
                }

                mostrarAlerta('APR salva com sucesso!');
                document.getElementById('form-apr').reset();
                document.getElementById('data_emissao').valueAsDate = new Date();
                document.getElementById('container-etapas').innerHTML = '';
                document.getElementById('container-executantes').innerHTML = '';
                adicionarEtapa();
                adicionarExecutante(user.name);
                alternarFormularioApr();
                carregarAprs();
            } catch (e) {
                mostrarAlerta('Erro ao comunicar com a API ao salvar a APR.', 'erro');
            }
        }

        async function carregarAprs() {
            const lista = document.getElementById('lista-aprs');
            try {
                const resp = await fetch(`${API_URL}/aprs`, { headers: headersAuth() });

                if (resp.status === 401) {
                    sair();
                    return;
                }

                const aprs = await resp.json();

                if (!aprs.length) {
                    lista.innerHTML = '<p style="color: #6b7280;">Você ainda não possui APRs cadastradas. Clique em <strong>+ Nova APR</strong> para começar.</p>';
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Data</th>
                                <th>Cliente</th>
                                <th>Atividade</th>
                                <th>Local</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                aprs.forEach(apr => {
                    const dataFormatada = apr.data_emissao ? apr.data_emissao.split('-').reverse().join('/') : '-';
                    html += `
                        <tr>
                            <td>${apr.id}</td>
                            <td>${dataFormatada}</td>
                            <td>${apr.cliente ? apr.cliente.nome : '-'}</td>
                            <td>${apr.atividade}</td>
                            <td>${apr.local}</td>
                            <td class="acoes-tabela">
                                <a href="imprimir.html?id=${apr.id}" target="_blank" class="btn btn-primary btn-sm">Gerar PDF</a>
                                <button type="button" class="btn btn-danger btn-sm" onclick="excluirApr(${apr.id})">Excluir</button>
                            </td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                lista.innerHTML = html;
            } catch (e) {
                lista.innerHTML = '<p style="color: #dc2626;">Erro ao carregar APRs. Verifique se o servidor Laravel está rodando.</p>';
            }
        }

        async function excluirApr(id) {
            if (!confirm('Deseja realmente excluir esta APR?')) return;

            const resp = await fetch(`${API_URL}/aprs/${id}`, {
                method: 'DELETE',
                headers: headersAuth()
            });

            if (resp.ok) {
                mostrarAlerta('APR excluída.');
                carregarAprs();
            }
        }

        inicializar();
    </script>
</body>
</html>
